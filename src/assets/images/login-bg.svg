<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030b2a"/>
      <stop offset="0.55" stop-color="#061a52"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="0.8" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="0.35" stop-color="#4f46e5"/>
      <stop offset="0.7" stop-color="#0a66ff"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- One ribbon strand, repeated with offsets to form silky bands -->
    <path id="strandA" d="M-100 620 C 250 380, 520 300, 820 420 S 1350 640, 1700 300" fill="none"/>
    <path id="strandB" d="M-100 260 C 300 520, 640 640, 960 560 S 1420 300, 1700 520" fill="none"/>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="1180" cy="380" rx="520" ry="360" fill="url(#glow)"/>
  <ellipse cx="260" cy="820" rx="420" ry="260" fill="url(#glow)" opacity="0.5"/>

  <!-- Soft glowing under-layer -->
  <g filter="url(#soft)" opacity="0.7">
    <use href="#strandA" stroke="url(#ribbonA)" stroke-width="90"/>
    <use href="#strandB" stroke="url(#ribbonB)" stroke-width="70" transform="translate(0 40)"/>
  </g>

  <!-- Fine strands: band A -->
  <g stroke="url(#ribbonA)" stroke-width="1.6" opacity="0.85">
    <use href="#strandA"/>
    <use href="#strandA" transform="translate(0 10)"/>
    <use href="#strandA" transform="translate(0 20)"/>
    <use href="#strandA" transform="translate(0 30)"/>
    <use href="#strandA" transform="translate(0 40)"/>
    <use href="#strandA" transform="translate(0 50)"/>
    <use href="#strandA" transform="translate(0 60)"/>
    <use href="#strandA" transform="translate(0 72)"/>
    <use href="#strandA" transform="translate(0 86)"/>
    <use href="#strandA" transform="translate(0 102)"/>
    <use href="#strandA" transform="translate(0 120)"/>
  </g>
  <g filter="url(#haze)" stroke="url(#ribbonA)" stroke-width="10" opacity="0.5">
    <use href="#strandA" transform="translate(0 30)"/>
    <use href="#strandA" transform="translate(0 70)"/>
  </g>

  <!-- Fine strands: band B -->
  <g stroke="url(#ribbonB)" stroke-width="1.4" opacity="0.75">
    <use href="#strandB"/>
    <use href="#strandB" transform="translate(0 12)"/>
    <use href="#strandB" transform="translate(0 24)"/>
    <use href="#strandB" transform="translate(0 36)"/>
    <use href="#strandB" transform="translate(0 50)"/>
    <use href="#strandB" transform="translate(0 66)"/>
    <use href="#strandB" transform="translate(0 84)"/>
    <use href="#strandB" transform="translate(0 104)"/>
  </g>
  <g filter="url(#haze)" stroke="url(#ribbonB)" stroke-width="8" opacity="0.45">
    <use href="#strandB" transform="translate(0 40)"/>
  </g>
</svg>
